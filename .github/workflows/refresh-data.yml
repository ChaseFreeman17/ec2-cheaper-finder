name: Refresh EC2 pricing data

on:
  schedule:
    # Once a day. AWS updates the Price List bulk file as prices change; see
    # docs/adr/0001-static-site-with-scheduled-data-refresh.md for why daily is enough.
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch + trim AWS pricing data
        run: node scripts/refresh-data.js
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Commit data if it changed
        run: |
          if git diff --quiet -- data/instances.json; then
            echo "No pricing changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/instances.json
          git commit -m "chore: refresh EC2 pricing data"
          git push
